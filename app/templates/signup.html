{% extends "base.html" %}{% block title %}Sign up · PocketLedger{% endblock %}
{% block content %}
<div class="auth-card card shadow-sm mx-auto p-4">
 <h2 class="mb-1">Create your account</h2><p class="text-muted">Your transactions are private to your account.</p>
 <form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label class="form-label">Username</label><input class="form-control mb-3" name="username" maxlength="80" required>
  <label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required>
  <label class="form-label">Password (minimum 8 characters)</label><input class="form-control mb-3" type="password" name="password" minlength="8" required>
  <button class="btn btn-primary w-100">Create account</button>
 </form>
 <p class="mt-3 mb-0 text-center">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</div>{% endblock %}
