{% extends "base.html" %}{% block title %}{% if transaction %}Edit{% else %}Add{% endif %} transaction · PocketLedger{% endblock %}
{% block content %}
<div class="form-card card shadow-sm p-4 mx-auto"><h1 class="h3 mb-3">{% if transaction %}Edit transaction{% else %}Add transaction{% endif %}</h1>
<form method="post">
 <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
 <label class="form-label">Transaction type</label><select class="form-select mb-3" name="kind" required><option value="expense" {% if transaction and transaction.kind=='expense' %}selected{% endif %}>Expense</option><option value="income" {% if transaction and transaction.kind=='income' %}selected{% endif %}>Income</option></select>
 <label class="form-label">Amount (₹)</label><input class="form-control mb-3" type="number" min="0.01" step="0.01" name="amount" value="{{ transaction.amount if transaction else '' }}" required>
 <label class="form-label">Category</label><select class="form-select mb-3" name="category" required>{% for c in categories %}<option value="{{ c }}" {% if transaction and transaction.category==c %}selected{% endif %}>{{ c }}</option>{% endfor %}</select>
 <label class="form-label">Date</label><input class="form-control mb-3" type="date" name="transaction_date" value="{{ transaction.transaction_date.isoformat() if transaction else '' }}" required>
 <label class="form-label">Description (optional)</label><input class="form-control mb-4" name="description" maxlength="200" value="{{ transaction.description if transaction else '' }}" placeholder="e.g. Weekly groceries">
 <div class="d-flex gap-2"><button class="btn btn-primary">Save transaction</button><a class="btn btn-outline-secondary" href="{{ url_for('transactions.list_transactions') }}">Cancel</a></div>
</form></div>{% endblock %}
