{% extends "base.html" %}{% block title %}Login · PocketLedger{% endblock %}
{% block content %}
<div class="auth-card card shadow-sm mx-auto p-4">
 <h2 class="mb-1">Welcome back</h2><p class="text-muted">Log in to manage your finances.</p>
 <form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label class="form-label">Username or email</label><input class="form-control mb-3" name="identity" required>
  <label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" required>
  <button class="btn btn-primary w-100">Log in</button>
 </form>
 <p class="mt-3 mb-0 text-center">New here? <a href="{{ url_for('auth.signup') }}">Create an account</a></p>
</div>{% endblock %}
